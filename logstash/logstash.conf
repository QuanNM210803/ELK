input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread}\] %{LOGLEVEL:log_level} \[%{UUID:request_id}\] \[%{DATA:username}\] \[%{DATA:api}\] %{DATA:logger} - %{GREEDYDATA:log_message}"
    }
    target => "message_metadata"
  }
}

output {
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "123456"
    index => "cvconnect-logs-%{+YYYY.MM}"
  }
}