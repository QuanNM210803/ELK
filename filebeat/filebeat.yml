fields:
    server_ip: "${SERVER_IP:172.18.0.2}"
fields_under_root: true

filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    include_lines:
      - '^[0-9]{4}-[0-9]{2}-[0-9]{2}'

processors:
  - add_docker_metadata: {}
  - drop_fields:
      fields:
        - "container.labels"
        - "agent"
        - "ecs"
        - "host"
        - "input"
      ignore_missing: true
  - drop_event:
      when:
        not:
          or:
            - equals:
                container.name: "user-service-cvconnect"
            - equals:
                container.name: "core-service-cvconnect"
            - equals:
                container.name: "notify-service-cvconnect"

output.logstash:
  hosts: ["logstash:5044"]
